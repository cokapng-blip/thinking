displayName="Naval Warfare"
description="Sistema completo de guerra naval estratégica para Minecraft. Regiões marítimas conquistáveis, janelas de assalto agendadas (estilo CCNet), sistema de pontuação anti-farm, reconhecimento de veículos (Create, Create:Aeronautics, etc.), objetivos estratégicos, recompensas, integração com mapas (Dynmap/BlueMap/Squaremap), histórico de batalhas e rankings."
authors="TLGD"
credits="Create team, Create:Aeronautics team, Movecraft team, Archipelago team, Eureka team"
displayURL="https://github.com/TLGD/NavalWarfare"
logoFile="navalwarfare_logo.png"

